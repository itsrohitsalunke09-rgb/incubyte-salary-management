spring.application.name=salary-management

# Shared in-memory SQLite: same engine as production, nothing written to disk.
spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=com.acme.salary.persistence.ConstraintAwareSQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100
