spring.application.name=salary-management
# Hosting platforms (Render, Railway, Fly, Heroku-style) inject PORT.
server.port=${PORT:8080}

# SQLite: a single file database, as suggested by the brief.
spring.datasource.url=jdbc:sqlite:${SALARY_DB_PATH:./salary.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection avoids SQLITE_BUSY errors.
# Fine for an HR tool with a handful of concurrent users.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=com.acme.salary.persistence.ConstraintAwareSQLiteDialect
# Schema is owned by Flyway migrations (db/migration). Hibernate's SQLite dialect silently
# drops unique constraints, so we never let Hibernate generate DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Stable JSON shape for pages: { content: [...], page: { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

# Demo data: deterministic 10k employees, inserted only when the database is empty.
salary.seed.enabled=true
salary.seed.count=10000
salary.seed.random-seed=42

management.endpoints.web.exposure.include=health
