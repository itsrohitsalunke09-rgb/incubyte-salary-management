# Render Blueprint: builds the root Dockerfile and runs it as one web service.
# Free plan note: the disk is ephemeral, so the SQLite file is recreated (and re-seeded with the same
# deterministic 10,000 employees) on every deploy or restart. Fine for a demo; a paid persistent disk
# or a managed Postgres would be the production choice.
services:
  - type: web
    name: acme-salary-management
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
